# One job, two steps. Everything it checks lives in `npm run ci`, so a
# passing run is reproducible locally with the same command, and adding
# a check means editing package.json, not this file.
# Deploys are Cloudflare Workers Builds' job, not this workflow's.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: lint and tests need none of sharp's or
      # wrangler's install steps.
      - run: npm ci --ignore-scripts

      # Lint, deal tests, and the data checks for both games.
      - run: npm run ci

      # Regenerate sw.js and the CREDITS files, then fail if they differ
      # from what was committed. A stale precache list is how an asset
      # quietly goes missing offline.
      - name: Generated files are up to date
        run: |
          npm run manifest
          npm run moplants:credits
          git diff --exit-code -- public/sw.js CREDITS.md CREDITS-moplants.md
